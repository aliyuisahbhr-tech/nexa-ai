<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/nexa-ai/manifest.json">
<meta name="theme-color" content="#0b1020">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXA AI Assistant</title>
<style>
body {
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  margin: 0;
}
.container {
  max-width: 500px;
  margin: auto;
}
h1 { color: #64d8ff; font-size: 32px; }
.orb {
  width: 100px;
  height: 100px;
  margin: 25px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #fff, #45c8ff, #3942aa);
  box-shadow: 0 0 35px #45c8ff;
}
.card {
  background: #18233d;
  padding: 18px;
  border-radius: 18px;
  margin: 18px 0;
}
input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 7px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}
input, select {
  background: #0b1020;
  color: white;
}
button {
  background: #168bd2;
  color: white;
  font-weight: bold;
}
button:active { opacity: 0.7; }
#reply {
  background: #0b1020;
  padding: 15px;
  border-radius: 10px;
  min-height: 40px;
  line-height: 1.5;
}
.note {
  color: #b8c6dc;
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>
<div class="container">

<h1>🤖 NEXA AI</h1>
<p>Your Personal Voice Assistant</p>

<div class="orb"></div>

<div class="card">
  <label for="language">Choose your language</label>
  <select id="language">
    <option value="en-US">English</option>
    <option value="ha-NG">Hausa</option>
  </select>

  <button onclick="listen()">🎙️ TALK TO NEXA</button>

  <p id="status" class="note">
    Tap the microphone and speak.
  </p>

  <input id="message"
         placeholder="Type your question here">

  <button onclick="processCommand()">
    Send Message
  </button>
</div>

<div class="card">
  <h3>NEXA's Response</h3>
  <div id="reply">Sannu! Hello! I am NEXA AI.</div>
  <button onclick="speakReply()">🔊 Repeat Response</button>
</div>

<div class="card">
  <h3>Try These Commands</h3>
  <p class="note">
    Hello<br>
    Sannu<br>
    What time is it?<br>
    What is your name?<br>
    Open YouTube<br>
    Help me make a phone call
  </p>
</div>

<p class="note">
  NEXA AI Prototype — Version 1
</p>

</div>

<script>
let lastReply = "Sannu! Hello! I am NEXA AI.";

function say(text) {
  lastReply = text;
  document.getElementById("reply").textContent = text;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();

    let voice = new SpeechSynthesisUtterance(text);
    voice.lang = document.getElementById("language").value;
    voice.rate = 0.9;

    speechSynthesis.speak(voice);
  }
}

function speakReply() {
  say(lastReply);
}


  async function processCommand() {
const input = document.getElementById("message");
const q = input.value.trim();
const lang = document.getElementById("language").value;
const hausa = lang === "ha-NG";

if (!q) {
say(hausa ? "Rubuta tambayarka." : "Please type a message.");
return;
}

const command = q.toLowerCase();

if (
command.includes("hello") ||
command.includes("hi") ||
command.includes("sannu") ||
command.includes("ina kwana")
) {
say(hausa
? "Sannu! Yaya zan taimaka maka yau?"
: "Hello! How can I help you today?");

} else if (
command.includes("time") ||
command.includes("lokaci") ||
command.includes("karfe")
) {
const time = new Date().toLocaleTimeString([], {
hour: "numeric",
minute: "2-digit"
});

say(hausa
  ? "Yanzu karfe " + time
  : "The current time is " + time);

} else if (
command.includes("your name") ||
command.includes("sunanka") ||
command.includes("who are you")
) {
say(hausa
? "Sunana NEXA AI, mataimakinka."
: "My name is NEXA AI, your assistant.");

} else if (
command.includes("open youtube") ||
command.includes("bude youtube")
) {
say(hausa
? "Zan bude YouTube yanzu."
: "Opening YouTube now.");

setTimeout(function() {
  window.open("https://www.youtube.com/", "_blank");
}, 800);

} else if (
command.includes("call") ||
command.includes("kira")
) {
say(hausa
? "Shigar da lambar wayar da kake son kira."
: "Enter the phone number you want to call.");

const number = prompt(
  hausa ? "Shigar da lambar waya:" : "Enter the phone number:"
);

if (number && /^[+0-9\s()-]{5,20}$/.test(number)) {
  if (confirm("Open the dialer for " + number + "?")) {
    window.location.href =
      "tel:" + number.replace(/[\s()-]/g, "");
  }
} else if (number) {
  say(hausa ? "Lambar ba ta dace ba." : "That number doesn't look valid.");
}

} else if (
command.includes("help") ||
command.includes("taimako")
) {
say(hausa
? "Zan iya amsa tambayoyi, gaishe ka, gaya maka lokaci, bude YouTube, da taimaka maka bude wayar kira."
: "I can answer questions, greet you, tell the time, open YouTube, and help open your phone dialer.");

} else {
await askNexaAI(q, lang);
}

input.value = "";
}

async function askNexaAI(message, language) {
const status = document.getElementById("status");
const hausa = language === "ha-NG";

status.textContent = hausa
? "NEXA AI na tunani..."
: "NEXA AI is thinking...";

try {
const response = await fetch(
"https://nexa-ai-brain-d61a.danbaiwa5050.workers.dev/",
{
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
message: message,
language: language
})
}
);

const data = await response.json();

if (!response.ok) {
  throw new Error(data.error || "AI request failed");
}

if (!data.reply) {
  throw new Error("No reply received");
}

say(data.reply);

status.textContent = hausa
  ? "An gama."
  : "Ready.";

} catch (error) {
console.error("NEXA AI error:", error);

say(hausa
  ? "Yi hakuri, na kasa haɗuwa da kwakwalwar AI. Ka duba intanet ka sake gwadawa."
  : "Sorry, I couldn't connect to my AI brain. Please check your internet and try again.");

status.textContent = hausa
  ? "Matsalar haɗi."
  : "Connection problem.";

}
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    document.getElementById("status").textContent =
      "Voice recognition is unavailable here. Please type instead.";
    return;
  }

  let recognition = new Recognition();
  recognition.lang =
    document.getElementById("language").value;
  recognition.interimResults = false;

  document.getElementById("status").textContent =
    "Listening... Speak now.";

  recognition.onresult = function(event) {
    document.getElementById("message").value =
      event.results[0][0].transcript;

    document.getElementById("status").textContent =
      "Voice received.";

    processCommand();
  };

  recognition.onerror = function() {
    document.getElementById("status").textContent =
      "Microphone issue. Check permissions or type instead.";
  };

  try {
    recognition.start();
  } catch (error) {
    document.getElementById("status").textContent =
      "Please try the microphone again.";
  }
}

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/nexa-ai/service-worker.js")
      .catch(error => console.error("Service worker registration failed:", error));
  });
}
</script>
</body>
</html>
